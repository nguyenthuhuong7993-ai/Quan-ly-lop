```html
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quản lý lớp</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- ==============================
         TIÊU ĐỀ
    =============================== -->

    <header class="header">

        <div>

            <h1>QUẢN LÝ LỚP</h1>

            <p>
                Quản lý học sinh nhanh chóng
            </p>

        </div>

    </header>


    <!-- ==============================
         THỐNG KÊ
    =============================== -->

    <section class="dashboard">

        <div class="stat-card">

            <span
                class="stat-number"
                id="classCount">
                0
            </span>

            <span
                class="stat-label">
                Lớp
            </span>

        </div>


        <div class="stat-card">

            <span
                class="stat-number"
                id="studentCount">
                0
            </span>

            <span
                class="stat-label">
                Học sinh
            </span>

        </div>

    </section>


    <!-- ==============================
         CHỌN LỚP
    =============================== -->

    <section class="section">

        <label for="classSelect">
            Chọn lớp
        </label>


        <select id="classSelect">

            <option value="">
                Đang tải danh sách lớp...
            </option>

        </select>

    </section>


    <!-- ==============================
         TÌM KIẾM
    =============================== -->

    <section class="section">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Tìm tên học sinh..."
            autocomplete="off"
        >

    </section>


    <!-- ==============================
         DANH SÁCH HỌC SINH
    =============================== -->

    <section class="section">

        <div class="section-title">

            <h2>
                Danh sách học sinh
            </h2>


            <span id="selectedClass">
                Chưa chọn lớp
            </span>

        </div>


        <!-- Trạng thái loading -->

        <div
            id="loading"
            class="loading">

            Đang tải dữ liệu...

        </div>


        <!-- Danh sách học sinh -->

        <div
            id="studentList"
            class="student-list">

        </div>

    </section>


    <!-- ==============================
         THÔNG BÁO
    =============================== -->

    <div
        id="message"
        class="message">

    </div>

</div>


<!-- ==============================
     JAVASCRIPT
=============================== -->

<script src="app.js"></script>

</body>

</html>
```
